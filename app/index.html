<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Game Hub</title>
<style>
  :root {
    --bg: #0f172a;
    --cell: #1e293b;
    --cell-hover: #334155;
    --accent: #38bdf8;
    --text: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 1rem;
  }
  h1 { margin-bottom: 0.25rem; }
  .screen { display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  #menu-buttons { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center; }
  .menu-btn {
    padding: 1rem 1.5rem;
    font-size: 1.1rem;
    border: none;
    border-radius: 10px;
    background: var(--cell);
    color: var(--text);
    cursor: pointer;
  }
  .menu-btn:hover { background: var(--cell-hover); }

  #rps-status, #guess-status { margin-bottom: 1rem; font-size: 1.1rem; min-height: 1.5rem; text-align: center; }

  #rps-choices { display: flex; gap: 1rem; }
  .rps-btn {
    font-size: 2.5rem;
    padding: 1rem 1.25rem;
    border: none;
    border-radius: 12px;
    background: var(--cell);
    cursor: pointer;
  }
  .rps-btn:hover { background: var(--cell-hover); }
  #rps-score { margin-top: 1rem; opacity: 0.8; }

  #guess-input {
    font-size: 1.2rem;
    padding: 0.5rem;
    width: 100px;
    text-align: center;
    border-radius: 6px;
    border: none;
    margin-right: 0.5rem;
  }
  #guess-history { margin-top: 1rem; opacity: 0.8; font-size: 0.9rem; text-align: center; }

  button.action {
    margin-top: 1.5rem;
    padding: 0.6rem 1.4rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
  }
  button.action:hover { opacity: 0.9; }
  button.link {
    margin-top: 1rem;
    background: none;
    border: none;
    color: var(--text);
    opacity: 0.7;
    cursor: pointer;
    text-decoration: underline;
  }
  footer { margin-top: 2rem; font-size: 0.75rem; opacity: 0.5; }
</style>
</head>
<body>

  <div id="menu" class="screen active">
    <h1>Mini Game Hub</h1>
    <div id="menu-buttons">
      <button class="menu-btn" onclick="showScreen('rps')">Rock Paper Scissors</button>
      <button class="menu-btn" onclick="showScreen('guess')">Guess the Number</button>
    </div>
  </div>

  <div id="rps" class="screen">
    <h1>Rock Paper Scissors</h1>
    <div id="rps-status">Pick one!</div>
    <div id="rps-choices">
      <button class="rps-btn" onclick="rpsPlay('rock')">🪨</button>
      <button class="rps-btn" onclick="rpsPlay('paper')">📄</button>
      <button class="rps-btn" onclick="rpsPlay('scissors')">✂️</button>
    </div>
    <div id="rps-score">Wins: 0 · Losses: 0 · Ties: 0</div>
    <button class="link" onclick="showScreen('menu')">&larr; Back to menu</button>
  </div>

  <div id="guess" class="screen">
    <h1>Guess the Number</h1>
    <div id="guess-status">I'm thinking of a number between 1 and 50</div>
    <div>
      <input id="guess-input" type="number" min="1" max="50" />
      <button class="action" onclick="guessTry()" style="margin-top:0;">Guess</button>
    </div>
    <div id="guess-history"></div>
    <button class="action" onclick="guessInit()">New Game</button>
    <button class="link" onclick="showScreen('menu')">&larr; Back to menu</button>
  </div>

  <footer>Running on Kubernetes, deployed via ArgoCD</footer>

<script>
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'guess') guessInit();
  }

  const rpsStatusEl = document.getElementById('rps-status');
  const rpsScoreEl = document.getElementById('rps-score');
  const rpsEmoji = { rock: '🪨', paper: '📄', scissors: '✂️' };
  let wins = 0, losses = 0, ties = 0;

  function rpsPlay(choice) {
    const options = ['rock', 'paper', 'scissors'];
    const cpu = options[Math.floor(Math.random() * 3)];
    let result;
    if (choice === cpu) {
      result = "It's a tie!";
      ties++;
    } else if (
      (choice === 'rock' && cpu === 'scissors') ||
      (choice === 'paper' && cpu === 'rock') ||
      (choice === 'scissors' && cpu === 'paper')
    ) {
      result = 'You win!';
      wins++;
    } else {
      result = 'You lose!';
      losses++;
    }
    rpsStatusEl.textContent = `You: ${rpsEmoji[choice]}  vs  CPU: ${rpsEmoji[cpu]}  —  ${result}`;
    rpsScoreEl.textContent = `Wins: ${wins} · Losses: ${losses} · Ties: ${ties}`;
  }

  const guessStatusEl = document.getElementById('guess-status');
  const guessHistoryEl = document.getElementById('guess-history');
  const guessInputEl = document.getElementById('guess-input');
  let secretNumber, guessCount, guessLog;

  function guessInit() {
    secretNumber = Math.floor(Math.random() * 50) + 1;
    guessCount = 0;
    guessLog = [];
    guessStatusEl.textContent = "I'm thinking of a number between 1 and 50";
    guessHistoryEl.textContent = '';
    guessInputEl.value = '';
  }

  function guessTry() {
    const val = parseInt(guessInputEl.value, 10);
    if (!val || val < 1 || val > 50) return;
    guessCount++;
    if (val === secretNumber) {
      guessStatusEl.textContent = `🎉 Correct! It was ${secretNumber}. Guesses: ${guessCount}`;
    } else {
      const hint = val < secretNumber ? 'higher' : 'lower';
      guessLog.push(`${val} → go ${hint}`);
      guessStatusEl.textContent = `Try again — go ${hint}`;
      guessHistoryEl.textContent = guessLog.join(' · ');
    }
    guessInputEl.value = '';
  }

  guessInit();
</script>
</body>
</html>
