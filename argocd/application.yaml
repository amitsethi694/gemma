apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gemma4
  namespace: argocd          # ArgoCD control-plane namespace
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/amitsethi694/gemma.git
    targetRevision: main            # branch/tag to track
    path: k8s                       # folder containing the plain manifests

  destination:
    server: https://kubernetes.default.svc   # in-cluster; change for a remote cluster
    namespace: gemma4

  syncPolicy:
    automated:
      prune: true       # remove resources deleted from git
      selfHeal: true    # revert manual cluster drift back to git state
    syncOptions:
      - CreateNamespace=true
