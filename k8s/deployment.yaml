apiVersion: apps/v1
kind: Deployment
metadata:
  name: games
  namespace: games
  labels:
    app: games
spec:
  replicas: 2
  selector:
    matchLabels:
      app: games
  template:
    metadata:
      labels:
        app: games
    spec:
      containers:
        - name: games
          # built and pushed by .github/workflows/build-and-release.yml
          image: ghcr.io/amitsethi694/gemma:07c925762340d941f8b22cd5992699ff1b6bb148
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
